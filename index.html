<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiftHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="max-w-6xl mx-auto">
   <!-- Row 1: logo, search bar, add to cart button-->
    <div class="flex items-center justify-between py-4 border-b">
      <!-- Logo -->
        <div class="flex items-center gap-2">
         <i data-lucide="gift" class="w-6 h-6"></i>
         <span class="text-lg font-medium">GiftHub</span>
        </div>
        <!-- Search bar -->
        <div class="flex-1 max-w-md mx-8 ">
  <input type="text" placeholder="Search for gifts..." class="w-full px-4 py-2 border rounded-md bg-gray-100">
</div>
<!-- Add to cart button -->
<button class=" border rounded-md py-1 px-2.5 hover:bg-gray-200">
  <i data-lucide="shopping-cart" class="w-3.5 h-5"></i>
</button>
</div>
</div>
<div class="border-b">
    <nav class="max-w-6xl mx-auto flex gap-6 py-3">
      <a href="#" class=" px-2 py-1.5 text-xs font-medium hover:bg-gray-200 rounded-md">All Gifts</a>
      <a href="#" class=" px-2 py-1.5 text-xs font-medium hover:bg-gray-200 rounded-md">Birthday</a>
      <a href="#" class=" px-2 py-1.5 text-xs font-medium hover:bg-gray-200 rounded-md">Anniversary</a>
      <a href="#" class=" px-2 py-1.5 text-xs font-medium hover:bg-gray-200 rounded-md">Holiday</a>
      <a href="#" class=" px-2 py-1.5 text-xs font-medium hover:bg-gray-200 rounded-md">Personalized</a>
      <a href="#" class=" px-2 py-1.5 text-xs font-medium hover:bg-gray-200 rounded-md">Jewelry</a>
      <a href="#" class=" px-2 py-1.5 text-xs font-medium hover:bg-gray-200 rounded-md">Home & Decor</a>
    </nav>
  </div>
  
  <section class="bg-gray-100">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-8 py-16">
      <div class="flex-1">
        <h1 class="text-5xl font-medium mb-6">Find the Perfect Gift for Every Occasion</h1>
        <p class="text-gray-600 mb-5">Discover unique and thoughtful gifts that will make your loved ones smile. From personalized treasures to timeless classics, we have something special for everyone.</p>
        <div class="flex gap-4">
          <button class="bg-black font-bold text-white text-xs rounded-md py-2.5 px-5">Shop Now</button>
          <button class="bg-white font-bold text-xs rounded-md py-2.5 px-5 hover:bg-gray-200">Gift Guide</button>
        </div> 
      </div>
      <div class="flex-1">
        <img src="assets/images/gift-box-2.jpg" alt="Pink gift box" class="w-full rounded-lg">
      </div>
    </div>
    </section>
  </header>
  <script>
  lucide.createIcons();
</script>
</body>
</html>
