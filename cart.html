<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart - GiftHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="font-sans text-gray-900 bg-white min-h-screen flex flex-col justify-between">

<!-- Cart header -->
<div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
  <h1 class="font-bold text-base">Shopping Cart</h1>
  <div class="flex items-center gap-3">
    <span id="cart-count-badge" class="bg-gray-100 text-gray-600 text-xs px-2.5 py-1 
    rounded-full">0 items</span>
    <a href="index.html" class="text-gray-400 hover:text-gray-700">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
      stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </a>
  </div>
</div>

<!-- Cart body -->
<div id="cart-body" class="flex-1 flex flex-col items-center justify-center gap-3 px-5">
  <p class="text-sm text-gray-500">Your cart is empty</p>
  <a href="index.html" class="border border-gray-200 rounded-md px-4 py-2 text-sm font-medium 
  hover:bg-gray-50">Continue Shopping</a>
</div>

<!-- Cart footer (totals + checkout), hidden while empty -->
<div id="cart-footer" class="hidden border-t border-gray-200 px-5 py-4">
  <div class="flex justify-between items-center mb-3">
    <span class="text-sm font-semibold">Total</span>
    <span id="cart-total" class="text-base font-bold">$0.00</span>
  </div>
  <button class="w-full bg-gray-900 text-white rounded-md py-2.5 text-sm font-semibold 
  hover:bg-gray-800">Checkout</button>
</div>


<div id="cart-backdrop" onclick="closeCart()" class="hidden fixed inset-0 bg-black/40 z-40"></div>
 
  <aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-sm bg-white shadow-xl z-50
  transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
      <h1 class="font-bold text-base">Shopping Cart</h1>
      <div class="flex items-center gap-3">
        <span id="cart-count-badge" class="bg-gray-100 text-gray-600 text-xs px-2.5 py-1 
        rounded-full">0 items</span>
        <button onclick="closeCart()" class="text-gray-400 hover:text-gray-700">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" 
          stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
 
    <div id="cart-body" class="flex-1 flex flex-col items-center justify-center gap-3 px-5">
      <p class="text-sm text-gray-500">Your cart is empty</p>
      <button onclick="closeCart()" class="border border-gray-200 rounded-md px-4 py-2 text-sm font-medium 
      hover:bg-gray-50">Continue Shopping</button>
    </div>
 
    <div id="cart-footer" class="hidden border-t border-gray-200 px-5 py-4">
      <div class="flex justify-between items-center mb-3">
        <span class="text-sm font-semibold">Total</span>
        <span id="cart-total" class="text-base font-bold">$0.00</span>
      </div>
      <button class="w-full bg-gray-900 text-white rounded-md py-2.5 text-sm font-semibold 
      hover:bg-gray-800">Checkout</button>
    </div>
  </aside>

</body>
</html>
