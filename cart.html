<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart - GiftHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="font-sans text-gray-900 bg-white min-h-screen">
  <header class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
    <h1 class="font-bold text-base">Shopping Cart</h1>
    <div class="flex items-center gap-3">
      <span id="cart-count-badge" class="bg-gray-100 text-gray-600 text-xs px-2.5 py-1 rounded-full">0 items</span>
      <a href="index.html" class="text-sm text-gray-600 hover:text-gray-900">Continue shopping</a>
    </div>
  </header>

  <main class="mx-auto w-full max-w-3xl px-5 py-8">
    <div id="cart-empty" class="flex flex-col items-center gap-3 py-16">
      <p class="text-sm text-gray-500">Your cart is empty</p>
      <a href="index.html" class="border border-gray-200 rounded-md px-4 py-2 text-sm font-medium hover:bg-gray-50">Browse gifts</a>
    </div>
    <div id="cart-items"></div>
  </main>

  <footer id="cart-footer" class="hidden border-t border-gray-200 px-5 py-4">
    <div class="mx-auto flex max-w-3xl justify-between items-center">
      <span class="text-sm font-semibold">Total</span>
      <span id="cart-total" class="text-base font-bold">$0.00</span>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
